<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MateWake Smart Alarm</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
  </head>

  <body>
    <div class="card">
      <h2>MateWake - Smart Alarm</h2>
      <div id="connectionStatus" class="status-bar">З'єднання з хмарою...</div>
      <div class="main-layout">
        <div class="left-column">
          <div class="form-panel">
            <label>Коли ви лягаєте спати?</label>
            <input type="time" id="sleepTime" value="23:00" />
            <label>Вікно пробудження (з):</label>
            <input type="time" id="wakeStart" value="06:30" />
            <label>Вікно пробудження (до):</label>
            <input type="time" id="wakeEnd" value="07:00" />
            <button class="send-btn" onclick="sendToMqtt()">
              Оновити налаштування
            </button>
            <div
              id="localRecommendedWake"
              style="margin-top: 8px; color: white; font-size: 14px"
            ></div>
          </div>
          <div id="optimizedBlock"></div>
        </div>
        <div class="right-column">
          <div id="environmentBlock"></div>
        </div>
      </div>
    </div>

    <audio id="wakeSound" preload="auto">
      <source src="alarm.mp3" type="audio/mpeg" />
    </audio>

    <script src="app.js"></script>
  </body>
</html>
